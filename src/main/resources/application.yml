spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
    default: local
  application:
    name: RallitBackend
  config:
    import: optional:file:${RALLIT_ENV_FILE:.env}[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      database: ${REDIS_DATABASE:0}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
rallit:
  auth:
    service-origins: ${SERVICE_ORIGINS:https://rallit.co.kr}
    admin-origins: ${ADMIN_ORIGINS:https://admin.rallit.co.kr}
    service-key: ${JWT_SERVICE_KEY:}
    admin-key: ${JWT_ADMIN_KEY:}
    frontend-callback-url: ${FRONTEND_CALLBACK_URL:}
    admin-frontend-callback-url: ${ADMIN_FRONTEND_CALLBACK_URL:}
    kakao-client-id: ${KAKAO_REST_API_KEY:}
    kakao-client-secret: ${KAKAO_CLIENT_SECRET:}
    kakao-redirect-uri: ${KAKAO_REDIRECT_URI:}
    secure-cookies: ${AUTH_SECURE_COOKIES:true}
    google:
      enabled: ${GOOGLE_LOGIN_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
server:
  forward-headers-strategy: native
