spring:
  application:
    name: RallitBackend
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  forward-headers-strategy: native
