name: CI

on:
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'
  push:
    branches:
      - develop
      - 'release/**'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: 테스트 및 JAR 빌드
        run: sh ./gradlew test bootJar --console=plain
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
      - name: Docker 이미지 빌드 검증
        run: docker build -t rallit-backend:ci .
      - name: Docker Compose 설정 검증
        run: |
          docker compose --env-file .env.deploy.example config --quiet
          db_services="$(COMPOSE_PROFILES='' docker compose --env-file .env.deploy.example --profile local-db config --services)"
          grep -qx db <<< "$db_services"
          grep -qx redis <<< "$db_services"
          default_services="$(COMPOSE_PROFILES='' docker compose --env-file .env.deploy.example config --services)"
          grep -qx app <<< "$default_services"
          grep -qx redis <<< "$default_services"
          if grep -qx db <<< "$default_services"; then
            echo "::error::local-db 프로필 없이 db가 활성화됐습니다."
            exit 1
          fi
      - name: JAR 업로드
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-jar
          path: build/libs/app.jar
          retention-days: 1
          if-no-files-found: error
