name: Deploy to EC2

on:
  workflow_call:
    inputs:
      image-tag:
        type: string
        required: true
      environment:
        type: string
        required: true
      require-latest-main:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: ${{ vars.DOCKER_IMAGE }}:${{ inputs.image-tag }}
    steps:
      - name: 배포 설정 누락 확인
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in DOCKER_IMAGE DOCKERHUB_USERNAME DEPLOY_PATH DOCKERHUB_TOKEN EC2_HOST EC2_USERNAME EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Secrets/Variables에 $name 항목이 없습니다."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-jar
          path: build/libs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
          tags: ${{ env.IMAGE }}
          push: true

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    concurrency:
      group: ec2-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.DOCKER_IMAGE }}:${{ inputs.image-tag }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_TARGET: ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}
      INCOMING_DIR: .incoming-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: main 최신 커밋 여부 확인
        id: latest
        if: inputs.require-latest-main
        shell: bash
        run: |
          latest="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA 는 main 최신 커밋($latest)이 아니므로 배포를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH 설정
        if: steps.latest.outputs.skip != 'true'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: 배포 파일 전송
        if: steps.latest.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$SSH_TARGET" "mkdir -p '$DEPLOY_PATH/$INCOMING_DIR'"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes compose.yml deploy/deploy.sh "$SSH_TARGET:$DEPLOY_PATH/$INCOMING_DIR/"
      - name: 원격 배포 및 헬스체크
        if: steps.latest.outputs.skip != 'true'
        run: ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$SSH_TARGET" "cd '$DEPLOY_PATH' && flock --verbose -w 600 .deploy.lock sh -c 'mv $INCOMING_DIR/compose.yml $INCOMING_DIR/deploy.sh . && rmdir $INCOMING_DIR && bash deploy.sh \"$IMAGE\"'"
      - name: 배포 결과 기록
        if: always() && steps.latest.outputs.skip != 'true'
        env:
          RESULT: ${{ job.status }}
          TARGET: ${{ inputs.environment }}
        run: echo "**$TARGET** 배포 결과 $RESULT · \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
